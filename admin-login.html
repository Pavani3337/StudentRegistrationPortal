<p>Administrator Login</p>

<main>

<div class="login-box">

<h2>Admin Login</h2>

<form>

<input
type="text"
placeholder="Enter Admin Username"

<input

placeholder="Enter Password"
required>

<button type="submit">

Login

</button>

</form>

<a href="index.html">

← Back to Home

</a>

</p>

</div>

</main>

</footer>
