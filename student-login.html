<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Login</title>

    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="student.css">
</head>

<body>

    <header>
        <h1>Student Registration Portal</h1>
        <p>Student Login</p>
    </header>

    <main>

        <div class="login-box">

            <h2>Student Login</h2>

            <form action="#">

                <label>Roll Number / Email</label>

                <input
                    type="text"
                    id="username"
                    placeholder="Enter Email"
                    required>

                <label>Password</label>

                <input
                    type="password"
                    id="password"
                    placeholder="Enter Password"
                    required>

                <button type="submit">
                    Login
                </button>

            </form>

            <p class="register-link">

                New Student?

                <a href="student-register.html">
                    Register Here
                </a>

            </p>

            <a href="index.html">
                ← Back to Home
            </a>

        </div>

    </main>

    <footer>

        <p>
            © 2026 Student Registration Portal
        </p>

    </footer>

    <script src="student-login.js"></script>

</body>

</html>
