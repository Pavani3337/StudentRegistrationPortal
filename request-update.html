
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">

<title>Request Profile Update</title>

<link rel="stylesheet" href="style.css">
<link rel="stylesheet" href="dashboard.css">
<link rel="stylesheet" href="profile.css">
</head>

<body>

<header>
<h1>Student Registration Portal</h1>
</header>

<nav>
<a href="student-dashboard.html">Dashboard</a>
<a href="profile.html">My Profile</a>
<a href="request-update.html">Request Update</a>
<a href="request-status.html">Request Status</a>
<a href="index.html">Logout</a>
</nav>

<main>

<div class="profile-card">

<h2>Request Profile Update</h2>

<form>

<label>Select Field to Update</label>

<select id="field" required>

    <option value="">Select Field</option>

    <option>Phone Number</option>

    <option>Email</option>

    <option>Address</option>

    <option>Photo</option>

</select>


<label>Current Value</label>
<input type="text" id="currentValue">

<label>Requested New Value</label>
<input type="text" id="requestedValue" required>

<label>Reason</label>
<textarea id="reason" rows="4"></textarea>

<button type="submit">Submit Request</button>

</form>

</div>

</main>

<footer>
<p>© 2026 Student Registration Portal</p>
</footer>


<script src="request-update.js"></script>


</body>
</html>
